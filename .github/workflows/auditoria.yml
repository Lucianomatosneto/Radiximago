# Central de Auditoria Contínua do Radix Imago
#
# O que é: uma "esteira" automática do GitHub que roda sozinha (mesmo sem
# nenhuma conversa do Claude aberta) e confere qualidade, testes e segurança.
#
# Quando roda:
#   - a cada Pull Request (pedido para juntar código);
#   - toda segunda-feira, 06h (horário de Brasília);
#   - quando você clicar em "Run workflow" na aba Actions.
#
# Regras de segurança desta esteira:
#   - só LÊ o repositório (permissions: contents: read);
#   - usa um banco PostgreSQL descartável, criado e destruído a cada execução;
#   - usa senhas inventadas na hora; nenhum dado clínico e nenhuma credencial real;
#   - NÃO publica nada e NÃO mexe em produção.
#
# Política dos "portões":
#   - Testes do backend e do frontend e TypeScript: se falharem, a execução fica
#     VERMELHA (bloqueante).
#   - Ferramentas de segurança e qualidade (Ruff, pip-audit, npm audit,
#     Gitleaks, Semgrep): apenas INFORMAM nesta fase inicial (continue-on-error),
#     para não travar o desenvolvimento enquanto a linha de base é tratada.
#     Os resultados ficam nos relatórios (Artifacts) e no resumo da execução.

name: Auditoria contínua

on:
  pull_request:
  schedule:
    - cron: "0 9 * * 1" # segunda-feira, 09:00 UTC = 06:00 em Brasília
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auditoria-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-testes:
    name: Backend - testes (pytest + PostgreSQL de teste)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: radix_user
          POSTGRES_PASSWORD: ci_descartavel
          POSTGRES_DB: radix_imago_teste # o nome tem "teste": exigido pelo conftest.py
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radix_user -d radix_imago_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://radix_user:ci_descartavel@localhost:5432/radix_imago_teste
      ORTHANC_PASSWORD: ci_descartavel
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # mesma versão do backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar Tesseract (leitor de texto usado na anonimização)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Instalar dependências do backend
        run: pip install -r backend/requirements.txt

      - name: Criar chave JWT descartável
        run: echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Aplicar migrações (Alembic) no banco de teste
        working-directory: backend
        run: alembic upgrade head

      - name: Rodar a suíte de testes
        working-directory: backend
        run: pytest -q -p no:cacheprovider --tb=short --junitxml=../relatorio-pytest.xml

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Backend - testes"
            python - <<'PY'
          import xml.etree.ElementTree as ET
          try:
              s = ET.parse("relatorio-pytest.xml").getroot()
              s = s if s.tag == "testsuite" else s[0]
              t, f, e, k = (int(s.get(x, 0)) for x in ("tests", "failures", "errors", "skipped"))
              print(f"- Executados: {t}\n- Aprovados: {t - f - e - k}\n- Reprovados: {f + e}\n- Ignorados: {k}")
          except Exception as erro:
              print("- Relatório não gerado:", erro)
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-backend-pytest
          path: relatorio-pytest.xml

  frontend:
    name: Frontend - TypeScript e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Conferir tipos (TypeScript)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Rodar testes do frontend (testes/*.teste.ts)
        working-directory: frontend
        run: |
          falhas=0
          for t in testes/*.teste.ts; do
            echo "::group::$t"
            npx --yes tsx "$t" || falhas=$((falhas+1))
            echo "::endgroup::"
          done
          echo "Arquivos de teste com falha: $falhas"
          [ "$falhas" -eq 0 ]

  qualidade:
    name: Qualidade do código Python (Ruff) - informativo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Ruff
        run: |
          mkdir -p relatorios
          ruff check backend --config auditoria/config/ruff.toml --statistics --output-format=concise \
            | tee relatorios/ruff.txt || true
          { echo "### Qualidade (Ruff)"; echo '```'; tail -20 relatorios/ruff.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-ruff
          path: relatorios/

  seguranca:
    name: Segurança (Gitleaks, pip-audit, npm audit, Semgrep) - informativo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo, para procurar segredos antigos

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Gitleaks - procurar senhas e chaves no histórico
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p relatorios
          versao=$(gh api repos/gitleaks/gitleaks/releases/latest --jq .tag_name | sed 's/^v//')
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${versao}/gitleaks_${versao}_linux_x64.tar.gz" | tar xz gitleaks
          # --redact: nunca imprime o valor do segredo nos relatórios
          ./gitleaks detect --source . --redact --report-format json \
            --report-path relatorios/gitleaks.json --exit-code 0
          echo "Gitleaks: $(python -c "import json;print(len(json.load(open('relatorios/gitleaks.json'))))") achado(s)"

      - name: pip-audit - vulnerabilidades nas bibliotecas Python
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt -f json -o relatorios/pip-audit.json || true
          pip-audit -r backend/requirements.txt || true

      - name: npm audit - vulnerabilidades nas bibliotecas do frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm audit --json > ../relatorios/npm-audit.json || true
          npm audit --omit=dev || true

      - name: Semgrep - análise estática de segurança do código
        run: |
          pip install semgrep
          semgrep scan --config p/python --config p/typescript --config p/owasp-top-ten \
            --json --output relatorios/semgrep.json --metrics=off backend/app frontend/src || true
          python - <<'PY'
          import json
          d = json.load(open("relatorios/semgrep.json"))
          print("Semgrep:", len(d.get("results", [])), "achado(s)")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios-seguranca
          path: relatorios/
