# OWASP ZAP — análise de segurança PASSIVA (só observa; NÃO ataca, NÃO tenta invadir).
# Roda SÓ manualmente (Actions → "ZAP passivo" → Run workflow), contra um Radix isolado
# e descartável criado dentro do runner. Nunca contra produção.
# Uma varredura ATIVA (que testa ataques) só deve existir com autorização expressa do responsável.
name: ZAP passivo

on:
  workflow_dispatch:
  # TEMPORÁRIO: validar o ZAP antes de o arquivo estar na main. Remover após a validação.
  push:
    branches: [auditoria/central]
    paths: [".github/workflows/zap-passivo.yml"]

permissions:
  contents: read

jobs:
  zap:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: radix_user
          POSTGRES_PASSWORD: ci_descartavel
          POSTGRES_DB: radix_imago_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radix_user -d radix_imago_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/subir-radix-isolado
      - name: ZAP baseline (passivo) no frontend isolado
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://127.0.0.1:3000
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          cmd_options: "-a" # inclui regras passivas "alfa"; continua sem ataque ativo
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-relatorio
