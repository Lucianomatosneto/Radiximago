# TESTES NO NAVEGADOR (Playwright) — um "robô" usa o site como uma pessoa.
# Sobe API + frontend isolados dentro do runner (banco descartável, sem dados reais).
# Testa telas públicas e, desde 13/11/2026, fluxos COM LOGIN (estudante e
# administrador com 2 etapas) usando contas descartáveis criadas a cada execução
# por backend/scripts/semear_usuarios_teste.py. BLOQUEANTE.
name: Testes no navegador (Playwright)

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: radix_user
          POSTGRES_PASSWORD: ci_descartavel
          POSTGRES_DB: radix_imago_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radix_user -d radix_imago_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/subir-radix-isolado
      - name: Semear usuários de teste (descartáveis; senhas e 2º fator sorteados agora)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://radix_user:ci_descartavel@localhost:5432/radix_imago_teste
          ORTHANC_PASSWORD: ci_descartavel
          ENVIRONMENT: test
        # as credenciais vão só para o $GITHUB_ENV (passos seguintes deste job),
        # escondidas no log com ::add-mask::; nunca para arquivo do repositório
        run: python -m scripts.semear_usuarios_teste --saida-env "$GITHUB_ENV"
      - name: Instalar Playwright e o Chromium
        working-directory: auditoria/ferramentas/frontend-testes
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Rodar os testes
        working-directory: auditoria/ferramentas/frontend-testes
        env:
          RADIX_URL: http://127.0.0.1:3000
        run: npx playwright test --config playwright.config.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-relatorio
          path: |
            auditoria/relatorios/playwright-html/
            auditoria/ferramentas/frontend-testes/test-results/
          if-no-files-found: ignore
