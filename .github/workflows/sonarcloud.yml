# SONARQUBE / SONARCLOUD — análise de qualidade e segurança do código.
#
# O SonarCloud é a versão na nuvem do SonarQube e é GRATUITO para repositórios públicos
# (o Radix é público). Este workflow só roda DEPOIS que você criar a conta e o segredo
# SONAR_TOKEN (passo a passo em auditoria/README.md). Sem o segredo, ele é ignorado
# sem erro. Cria dependência de um serviço externo: por isso exige sua autorização.
name: SonarCloud

on:
  workflow_dispatch:
  push:
    branches: [auditoria/central]
    paths: [".github/workflows/sonarcloud.yml"]
  schedule:
    - cron: "0 10 * * 1"

permissions:
  contents: read

jobs:
  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: radix_user
          POSTGRES_PASSWORD: ci_descartavel
          POSTGRES_DB: radix_imago_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radix_user -d radix_imago_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      DATABASE_URL: postgresql://radix_user:ci_descartavel@localhost:5432/radix_imago_teste
      ORTHANC_PASSWORD: ci_descartavel
      ENVIRONMENT: test
    steps:
      - name: Conferir se o SonarCloud foi configurado
        id: conf
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN não configurado: etapa ignorada (veja auditoria/README.md)." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ativo=nao" >> "$GITHUB_OUTPUT"
          else
            echo "ativo=sim" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.conf.outputs.ativo == 'sim'
        with:
          ref: redesign-ui   # branch de desenvolvimento real (enviada ao Sonar como 'main' para caber no plano gratuito)
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: steps.conf.outputs.ativo == 'sim'
        with:
          python-version: "3.11"
      - name: Preparar o backend para medir a cobertura dos testes
        if: steps.conf.outputs.ativo == 'sim'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
          pip install -r backend/requirements.txt pytest-cov
          echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Testes do backend com cobertura
        if: steps.conf.outputs.ativo == 'sim'
        working-directory: backend
        continue-on-error: true  # falha de teste nao impede a analise do Sonar (ela aparece no workflow de testes)
        run: |
          alembic upgrade head
          pytest -q -p no:cacheprovider --cov=app --cov-report=xml:coverage.xml
      - uses: SonarSource/sonarqube-scan-action@v5
        if: steps.conf.outputs.ativo == 'sim'
        with:
          args: >
            -Dsonar.organization=lucianomatosneto
            -Dsonar.projectKey=Lucianomatosneto_Radiximago
            -Dsonar.projectName="Radix Imago"
            -Dsonar.sources=backend/app,frontend/src
            -Dsonar.tests=backend/tests
            -Dsonar.exclusions=**/node_modules/**,**/.next/**,**/alembic/versions/**
            -Dsonar.python.version=3.11
            -Dsonar.python.coverage.reportPaths=backend/coverage.xml
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.branch.name=main
      - name: Listar os problemas encontrados (resumo)
        if: steps.conf.outputs.ativo == 'sim'
        run: |
          sleep 60
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, json, base64, urllib.request, collections
          tok = os.environ["SONAR_TOKEN"]
          h = {"Authorization": "Basic " + base64.b64encode((tok + ":").encode()).decode()}
          base = "https://sonarcloud.io/api/issues/search?componentKeys=Lucianomatosneto_Radiximago&branch=main&issueStatuses=OPEN,CONFIRMED&ps=500&p=%d"
          itens, pag = [], 1
          while True:
              d = json.load(urllib.request.urlopen(urllib.request.Request(base % pag, headers=h)))
              itens += d["issues"]
              if pag * 500 >= d["total"]: break
              pag += 1
          print("## SonarCloud — problemas abertos na redesign-ui:", len(itens))
          for q in ("SECURITY", "RELIABILITY"):
              sel = [i for i in itens if any(x["softwareQuality"] == q for x in i.get("impacts", []))]
              print("\n### %s: %d" % (q, len(sel)))
              por_regra = collections.Counter((i["rule"], i["message"][:90]) for i in sel)
              for (r, m), n in por_regra.most_common(12):
                  print("- %dx %s — %s" % (n, r, m))
              if q == "SECURITY":
                  for i in sel:
                      print("  * %s:%s [%s] %s" % (i["component"].split(":", 1)[-1], i.get("line"), i["severity"], i["message"][:120]))
          PY
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
