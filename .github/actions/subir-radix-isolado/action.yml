name: Subir o Radix Imago de forma isolada (para auditoria)
description: >
  Sobe API + frontend dentro do runner do GitHub, usando o PostgreSQL de teste do próprio job.
  Tudo é descartado quando o job termina. Usa senhas inventadas na hora. Nenhum dado real.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: backend/requirements.txt

    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Instalar Tesseract e dependências do backend
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
        pip install -r backend/requirements.txt

    - name: Migrações e API
      shell: bash
      working-directory: backend
      env:
        DATABASE_URL: postgresql://radix_user:ci_descartavel@localhost:5432/radix_imago_teste
        ORTHANC_PASSWORD: ci_descartavel
        ENVIRONMENT: test
        FRONTEND_URL: http://127.0.0.1:3000
      run: |
        export JWT_SECRET_KEY="$(openssl rand -hex 32)"
        # a mesma chave fica para os passos seguintes DESTE job (ex.: semear os
        # usuarios de teste com o 2o fator cifrado com ela), escondida no log
        echo "::add-mask::$JWT_SECRET_KEY"
        echo "JWT_SECRET_KEY=$JWT_SECRET_KEY" >> "$GITHUB_ENV"
        alembic upgrade head
        nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../api.log 2>&1 &
        for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/health >/dev/null && echo "API no ar" && exit 0; sleep 2; done
        echo "API não subiu"; tail -30 ../api.log; exit 1

    - name: Frontend (build de produção) e servidor
      shell: bash
      working-directory: frontend
      env:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        NEXT_TELEMETRY_DISABLED: "1"
      run: |
        npm ci --no-audit --no-fund
        npx next build
        nohup npx next start -p 3000 > ../frontend.log 2>&1 &
        for i in $(seq 1 30); do curl -fs -o /dev/null http://127.0.0.1:3000/login && echo "Frontend no ar" && exit 0; sleep 2; done
        echo "Frontend não subiu"; tail -30 ../frontend.log; exit 1
