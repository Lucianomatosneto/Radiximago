# Configuração do SonarCloud (organização e chave já preenchidas em 11/11/2026).
# Hoje o SonarCloud usa ANÁLISE AUTOMÁTICA (branch main, sem token). O workflow sonarcloud.yml só roda se existir
# o segredo SONAR_TOKEN e a análise automática for desligada no painel do SonarCloud (evita conflito).
sonar.host.url=https://sonarcloud.io
sonar.organization=lucianomatosneto
sonar.projectKey=Lucianomatosneto_Radiximago
sonar.projectName=Radix Imago
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/testes
sonar.exclusions=**/node_modules/**,**/.next/**,**/alembic/versions/**
# Fora SÓ da CONTA da cobertura (continuam analisados para bugs, vulnerabilidades e code smells):
# os 2 motores gráficos decorativos (canvas/WebGL). Lista nomeada, sem curinga. Decisão do Luciano, 14/11/2026.
# Ver auditoria/DECISAO_exclusao_motores_graficos_cobertura_2026-11-14.md
sonar.coverage.exclusions=frontend/src/components/login/motorCenaLogin.ts,frontend/src/components/fundo/motorMapaMundi.ts
sonar.python.version=3.11
sonar.sourceEncoding=UTF-8
