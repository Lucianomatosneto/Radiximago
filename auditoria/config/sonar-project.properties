# Configuração do SonarCloud. Preencha as duas linhas marcadas depois de criar a conta
# (passo a passo em auditoria/README.md). Enquanto estiver com "COLOQUE_AQUI", o workflow não roda.
sonar.host.url=https://sonarcloud.io
sonar.organization=COLOQUE_AQUI_O_NOME_DA_ORGANIZACAO
sonar.projectKey=COLOQUE_AQUI_A_CHAVE_DO_PROJETO
sonar.projectName=Radix Imago
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/testes
sonar.exclusions=**/node_modules/**,**/.next/**,**/alembic/versions/**
sonar.python.version=3.11
sonar.sourceEncoding=UTF-8
