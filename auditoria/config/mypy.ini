# Mypy: verificador de TIPOS do Python (acha erros como passar texto onde se espera número).
# Usado só pela Central de Auditoria; não muda o comportamento do sistema.
[mypy]
python_version = 3.11
ignore_missing_imports = True
check_untyped_defs = False
warn_unused_ignores = False
show_error_codes = True
pretty = False
exclude = (alembic|tests)/
namespace_packages = True
explicit_package_bases = True
mypy_path = backend
