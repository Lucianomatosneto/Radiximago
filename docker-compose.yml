services:
  # --- Banco de dados PostgreSQL ---
  radix-postgres:
    image: postgres:16
    container_name: radix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - radix-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Servidor DICOM Orthanc ---
  radix-orthanc:
    image: orthancteam/orthanc:latest
    container_name: radix-orthanc
    restart: unless-stopped
    ports:
      # 8042 NAO e mais exposto direto ao host - o navegador passa pelo
      # radix-orthanc-cors (que trata CORS). O backend (radix-api) continua
      # falando com radix-orthanc:8042 direto pela rede interna do compose.
      - '4242:4242'
    environment:
      - ORTHANC__AUTHENTICATION_ENABLED=true
      - ORTHANC__REGISTERED_USERS={"admin":"${ORTHANC_PASSWORD}"}
      - ORTHANC__DICOM_WEB__ENABLE=true
      - ORTHANC__DICOM_WEB__ROOT=/dicom-web/
    volumes:
      - orthanc_data:/var/lib/orthanc/db
    networks:
      - radix-network

  # --- Proxy CORS na frente do Orthanc (so pra trafego de navegador) ---
  # O Orthanc exige autenticacao e nao envia Access-Control-Allow-Origin em
  # nenhuma resposta (confirmado via curl) - o preflight OPTIONS do navegador
  # (que nunca leva credenciais) sempre bateria 401 direto nele. Este proxy
  # responde o OPTIONS sozinho e injeta os cabecalhos CORS no resto.
  radix-orthanc-cors:
    image: nginx:alpine
    container_name: radix-orthanc-cors
    restart: unless-stopped
    ports:
      - '8042:80'
    depends_on:
      - radix-orthanc
    volumes:
      - ./orthanc/cors-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - radix-network

  # --- Visualizador OHIF ---
  radix-ohif:
    image: ohif/viewer@sha256:b4bfecdc7cc670101cbfd01215fcd1f77b7cc5c867c5ed1cb10142f7a806ccd9
    container_name: radix-ohif
    restart: unless-stopped
    ports:
      - '3001:80'
    environment:
      - ORTHANC_PASSWORD=${ORTHANC_PASSWORD}
    # app-config.js e estatico (o nginx da imagem so serve, nao processa
    # variaveis de ambiente). O arquivo do repo e montado so como TEMPLATE
    # (ro, caminho separado, com o placeholder __ORTHANC_PASSWORD__), nunca
    # direto no caminho servido. No boot, geramos o app-config.js de verdade
    # dentro da camada gravavel do container (nunca no host, senao a senha
    # real acabaria gravada de volta no arquivo versionado) e encadeamos
    # (exec) pro entrypoint original da imagem - que ja usa esse mesmo padrao
    # (sed + exec "$@") pra outras credenciais (Google Healthcare API).
    # O "tr -d '\r'" remove CRLF antes de gravar: o core.autocrlf do Git no
    # Windows pode converter o template pra CRLF na copia de trabalho (o
    # commit em si e LF puro) - isso deixa o resultado imune a essa
    # divergencia, independente da terminacao de linha do arquivo montado.
    entrypoint:
      - /bin/bash
      - -c
      - sed "s|__ORTHANC_PASSWORD__|$$ORTHANC_PASSWORD|g" /usr/src/app-config.template.js | tr -d '\r' > /usr/share/nginx/html/app-config.js && exec /usr/src/entrypoint.sh "$$@"
      - bash
    command: ['nginx', '-g', 'daemon off;']
    depends_on:
      - radix-orthanc
    networks:
      - radix-network
    volumes:
      - ./ohif/index.html:/usr/share/nginx/html/index.html:ro
      - ./ohif/app-config.template.js:/usr/src/app-config.template.js:ro

  # --- Backend FastAPI ---
  radix-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: radix-api
    restart: unless-stopped
    ports:
      - '8000:8000'
    env_file:
      - .env
    depends_on:
      radix-postgres:
        condition: service_healthy
      radix-orthanc:
        condition: service_started
    volumes:
      - ./backend:/app
      - ./dicom_teste:/app/dicom_teste:ro
    networks:
      - radix-network

  # --- Frontend Next.js ---
  radix-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: radix-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on:
      - radix-api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - radix-network

# --- Volumes persistentes ---
volumes:
  postgres_data:
  orthanc_data:

# --- Rede interna ---
networks:
  radix-network:
    driver: bridge