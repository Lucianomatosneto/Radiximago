# Registros (logs) de todos os containers: formato padrao do Docker com
# tamanho LIMITADO - no maximo 5 arquivos de 10 MB por servico, os mais
# antigos sao descartados automaticamente (OWASP ASVS 16.2.3 e 14.2.4 -
# docs/REGISTROS.md). Sem isso, a saida crescia sem limite no disco.
x-registros: &registros
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  # --- Banco de dados PostgreSQL ---
  radix-postgres:
    image: postgres:16
    container_name: radix-postgres
    logging: *registros
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - radix-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Backup automatico local (Postgres + dados do Orthanc) ---
  # Roda em loop (ver scripts/backup.sh), uma vez por dia, mantendo so os
  # BACKUP_RETENCAO mais recentes de cada tipo. E so local (grava em
  # ./backups no host) - nao substitui um backup off-site.
  radix-backup:
    image: postgres:16-alpine
    container_name: radix-backup
    logging: *registros
    restart: unless-stopped
    environment:
      PGHOST: radix-postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_RETENCAO: 14
    entrypoint: ['sh', '/backup.sh']
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - orthanc_data:/orthanc_data:ro
    depends_on:
      radix-postgres:
        condition: service_healthy
    networks:
      - radix-network

  # --- Servidor DICOM Orthanc ---
  radix-orthanc:
    image: orthancteam/orthanc:latest
    container_name: radix-orthanc
    logging: *registros
    restart: unless-stopped
    ports:
      # 8042 NAO e mais exposto direto ao host - o navegador passa pelo
      # radix-orthanc-cors (que trata CORS). O backend (radix-api) continua
      # falando com radix-orthanc:8042 direto pela rede interna do compose.
      - '4242:4242'
    environment:
      - ORTHANC__AUTHENTICATION_ENABLED=true
      - ORTHANC__REGISTERED_USERS={"admin":"${ORTHANC_PASSWORD}"}
      - ORTHANC__DICOM_WEB__ENABLE=true
      - ORTHANC__DICOM_WEB__ROOT=/dicom-web/
    volumes:
      - orthanc_data:/var/lib/orthanc/db
    networks:
      - radix-network

  # --- Proxy CORS na frente do Orthanc (so pra trafego de navegador) ---
  # O Orthanc exige autenticacao e nao envia Access-Control-Allow-Origin em
  # nenhuma resposta (confirmado via curl) - o preflight OPTIONS do navegador
  # (que nunca leva credenciais) sempre bateria 401 direto nele. Este proxy
  # responde o OPTIONS sozinho e injeta os cabecalhos CORS no resto.
  radix-orthanc-cors:
    image: nginx:alpine
    container_name: radix-orthanc-cors
    logging: *registros
    restart: unless-stopped
    ports:
      - '8042:80'
    environment:
      - ORTHANC_PASSWORD=${ORTHANC_PASSWORD}
    # radix-api: a portaria das imagens (auth_request) consulta o backend
    depends_on:
      - radix-orthanc
      - radix-api
    # cors-proxy.conf.template e montado num caminho separado (nao direto
    # em conf.d, e NAO em /etc/nginx/templates/ - esse diretorio e
    # auto-processado via envsubst pelo entrypoint padrao da imagem nginx,
    # o que geraria um /etc/nginx/conf.d/cors-proxy.conf duplicado com
    # "listen 80" repetido por cima do default.conf que geramos abaixo)
    # porque tem o placeholder __ORTHANC_AUTH_BASIC__ - o boot gera o de
    # verdade dentro da camada gravavel do container (senao a senha real
    # acabaria gravada de volta no arquivo versionado), no mesmo padrao
    # usado no radix-ohif.
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed "s|__ORTHANC_AUTH_BASIC__|$$(printf '%s' "admin:$$ORTHANC_PASSWORD" | base64)|g" /usr/src/cors-proxy.conf.template | tr -d '\r' > /etc/nginx/conf.d/default.conf
        exec /docker-entrypoint.sh "$$@"
      - sh
    command: ['nginx', '-g', 'daemon off;']
    volumes:
      - ./orthanc/cors-proxy.conf.template:/usr/src/cors-proxy.conf.template:ro
    networks:
      - radix-network

  # --- Visualizador OHIF ---
  radix-ohif:
    # ohif/viewer (imagem antiga, mar/2023) foi descontinuada - o pipeline
    # oficial agora publica em ohif/app. Ja usa 100% o pipeline moderno de
    # dataSources, sem o mecanismo legado servers/activeServer que travava
    # com o server.dcmjs.org de demonstracao.
    # NAO usar v3.10.0+ (testado ate v3.13.0/latest): a partir dessa faixa
    # de versoes, a imagem publicada no Docker Hub parou de vir com os
    # "modes" compilados (nenhum @ohif/mode-* presente nos bundles) -
    # confirmado via grep direto nos arquivos servidos - entao o app quebra
    # com "No modes are defined!" independente do app-config.js, mesmo
    # espelhando exatamente o config do demo publico real (viewer.ohif.org),
    # que roda com extensions/modes vazios mas tem os modos compilados por
    # fora desse array. v3.9.2 e a mais recente confirmada com os modos
    # completos (mode-longitudinal, mode-segmentation, mode-tmtv, etc.)
    # E ja no pipeline moderno (0 ocorrencias de ADD_SERVER/activeServer).
    image: ohif/app:v3.9.2
    container_name: radix-ohif
    logging: *registros
    restart: unless-stopped
    ports:
      - '3001:80'
    # SEM ORTHANC_PASSWORD (out/2026): o app-config.js vai para qualquer
    # navegador e nao pode conter senha (OWASP ASVS 13.3.2). As imagens sao
    # pedidas aqui mesmo (/dicom-web) e repassadas ao radix-orthanc-cors, que
    # confere o login do Radix (ohif/radix-dicomweb.conf).
    # app-config.js e estatico (o nginx da imagem so serve, nao processa
    # variaveis de ambiente). O arquivo do repo e montado so como TEMPLATE
    # (ro, caminho separado; desde out/2026 SEM senha nenhuma dentro), nunca
    # direto no caminho servido. No boot, geramos o app-config.js de verdade
    # dentro da camada gravavel do container (nunca no host, senao a senha
    # real acabaria gravada de volta no arquivo versionado) e encadeamos
    # (exec) pro entrypoint original da imagem: /usr/src/entrypoint.sh (nao
    # /docker-entrypoint.sh - esse so cuida de wildcards genericos do nginx
    # oficial; e o /usr/src/entrypoint.sh que GERA o /etc/nginx/conf.d/
    # default.conf via envsubst nos templates da propria imagem. Pular esse
    # script deixa o nginx de pe sem nenhum "listen" configurado - confirmado
    # via teste real: container fica "Up" e com processos nginx rodando, mas
    # sem nenhuma porta aberta, curl da "connection refused").
    # Reescrito em /bin/sh (a imagem e Alpine puro, sem bash).
    # O "tr -d '\r'" remove CRLF antes de gravar: o core.autocrlf do Git no
    # Windows pode converter o template pra CRLF na copia de trabalho (o
    # commit em si e LF puro) - isso deixa o resultado imune a essa
    # divergencia, independente da terminacao de linha do arquivo montado.
    # O formato esperado do "auth" muda entre versoes do dicomweb-client:
    # na imagem antiga (ohif/viewer, mar/2023) o header precisava vir ja
    # pronto como "Basic <base64>". Nesta versao (ohif/app v3.9.2) e o
    # oposto - o getAuthorizationHeader() do proprio dicomweb-client faz
    # `Basic ${btoa(requestOptions.auth)}` internamente, entao "auth" tem
    # que ser a string crua "admin:senha" (mandar ja em base64 aqui causa
    # um duplo-encode e da 401 - confirmado testando os dois formatos direto
    # contra o proxy CORS via fetch no console do navegador).
    # Cache do app-config.js: o navegador cacheia a tag <script
    # src="/app-config.js"> do index.html agressivamente (a imagem nao manda
    # Cache-Control nenhum nesse arquivo, so ETag/Last-Modified - e mesmo
    # assim o navegador as vezes reusa o cache sem revalidar, mesmo em aba
    # nova ou apos Ctrl+Shift+R) e ignora recriacoes do container. Tentamos
    # colocar um "?v=timestamp" no <script src> do index.html via sed, mas
    # esse arquivo (e o diretorio dele) pertence a root e o container roda
    # como usuario nginx (imagem nginx-unprivileged) - sed nao tem permissao
    # de escrever ali. /etc/nginx/conf.d/ ja e gravavel pelo usuario nginx
    # (e onde o entrypoint original da imagem gera o default.conf), entao a
    # solucao foi gerar o default.conf nos mesmos (mesmo envsubst que o
    # entrypoint original usaria) e injetar Cache-Control: no-store so pra
    # esse arquivo - deixamos de encadear (exec) pro /usr/src/entrypoint.sh
    # original porque ele so faz esse envsubst + tratar variaveis que nao
    # usamos (APP_CONFIG env var, credenciais do Google Healthcare API);
    # replicar o envsubst aqui e mais simples que patchar o script deles.
    entrypoint:
      - /bin/sh
      - -c
      - |
        tr -d '\r' < /usr/src/app-config.template.js > /usr/share/nginx/html/app-config.js
        envsubst '$${PORT}' < /usr/src/default.conf.template > /etc/nginx/conf.d/default.conf
        sed -i '/^server {/a\  location = /app-config.js { root /usr/share/nginx/html; add_header Cache-Control "no-store"; }' /etc/nginx/conf.d/default.conf
        sed -i '/^server {/a\  include /etc/nginx/radix-dicomweb.conf;' /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
      - sh
    command: ['nginx', '-g', 'daemon off;']
    depends_on:
      - radix-orthanc
      - radix-orthanc-cors
    networks:
      - radix-network
    # ./ohif/index.html NAO e mais montado aqui: era so pra remover uma
    # referencia ao polyfill.io (dominio comprometido em 2024) que a imagem
    # antiga (mar/2023) tinha hardcoded. A ohif/app:v3.12.8 ja nao referencia
    # polyfill.io (confirmado: grep no index.html da propria imagem, 0
    # ocorrencias) - manter o mount so serviria pra sobrescrever o
    # index.html real (que referencia os hashes de bundle certos desta
    # versao) com uma copia congelada dos hashes da imagem antiga, quebrando
    # o carregamento dos bundles.
    volumes:
      - ./ohif/app-config.template.js:/usr/src/app-config.template.js:ro
      - ./ohif/radix-dicomweb.conf:/etc/nginx/radix-dicomweb.conf:ro

  # --- Backend FastAPI ---
  radix-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: radix-api
    logging: *registros
    restart: unless-stopped
    ports:
      - '8000:8000'
    env_file:
      - .env
    depends_on:
      radix-postgres:
        condition: service_healthy
      radix-orthanc:
        condition: service_started
    volumes:
      - ./backend:/app
      - ./dicom_teste:/app/dicom_teste:ro
      # tela Integracoes (cartao Armazenamento): le data/tamanho do ultimo
      # backup - SOMENTE LEITURA, a API nao consegue alterar nem apagar
      - ./backups:/backups:ro
    networks:
      - radix-network

  # --- Transcricao de voz (curadoria por voz) ---
  # Whisper "small" rodando LOCALMENTE (o audio nao sai daqui). Sem porta
  # publicada: so o radix-api conversa com ele, pela rede interna. O
  # modelo e baixado na construcao da imagem (precisa de internet so na
  # primeira vez: docker compose build radix-whisper). Teto de memoria
  # para nunca travar o computador; o modelo so e carregado quando o
  # curador usa o microfone e e descarregado apos 10 minutos parado.
  radix-whisper:
    build:
      context: ./whisper
      dockerfile: Dockerfile
      args:
        MODELO: small
    container_name: radix-whisper
    logging: *registros
    restart: unless-stopped
    environment:
      - RADIX_WHISPER_OCIOSO_S=600
      - RADIX_WHISPER_THREADS=4
      # chave compartilhada com a API (a mesma WHISPER_CHAVE do .env, que a
      # API le pelo env_file) - sem ela o servico recusa todos os pedidos
      # (OWASP ASVS 13.2.1, docs/COMUNICACOES.md)
      - RADIX_WHISPER_CHAVE=${WHISPER_CHAVE:-}
    mem_limit: 1600m
    cpus: 4
    networks:
      - radix-network

  # --- Frontend Next.js ---
  radix-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: radix-frontend
    logging: *registros
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    # WATCHPACK_POLLING: o bind mount do Windows (Docker Desktop) as vezes
    # nao propaga eventos de sistema de arquivos pro watcher nativo do
    # Next.js/webpack dentro do container - editar um arquivo no host nao
    # disparava o hot-reload (so um restart do container fazia o Next ler
    # o conteudo novo do disco). Polling e mais pesado mas funciona sempre,
    # independente do bind mount.
    environment:
      - WATCHPACK_POLLING=true
    depends_on:
      - radix-api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - radix-network

# --- Volumes persistentes ---
volumes:
  postgres_data:
  orthanc_data:

# --- Rede interna ---
networks:
  radix-network:
    driver: bridge