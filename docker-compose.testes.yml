# Somente para RODAR OS TESTES dentro do contêiner da API (02/11/2026).
# Vários testes conferem arquivos de fora da pasta backend (telas, documentos,
# Orthanc, arquivos do Docker). Este arquivo "empresta" essas pastas ao
# contêiner, SOMENTE LEITURA, para a suíte rodar completa. Não usar em produção.
#
# Ligar:     docker compose -f docker-compose.yml -f docker-compose.testes.yml up -d --no-deps radix-api
# Rodar:     docker compose exec radix-api python scripts/rodar_testes.py -q --tb=line -p no:warnings
# Voltar:    docker compose up -d --no-deps --force-recreate radix-api
services:
  radix-api:
    volumes:
      - ./backend:/backend:ro
      - ./frontend:/frontend:ro
      - ./docs:/docs:ro
      - ./orthanc:/orthanc:ro
      - ./whisper:/whisper:ro
      - ./docker-compose.yml:/docker-compose.yml:ro
      - ./docker-compose.prod.yml:/docker-compose.prod.yml:ro
      - ./docker-compose.tunel.yml:/docker-compose.tunel.yml:ro
      - ./docker-compose.telas-compiladas.yml:/docker-compose.telas-compiladas.yml:ro
