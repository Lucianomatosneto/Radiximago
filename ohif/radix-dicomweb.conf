# Incluido no server{} do nginx do OHIF (porta 3001) - ver docker-compose.yml.
#
# As imagens (DICOMweb e WADO) passam a ser pedidas na MESMA ORIGEM do
# visualizador. Este nginx so repassa ao proxy do Orthanc
# (radix-orthanc-cors), levando o cookie de login do Radix; la, a portaria
# (auth_request -> backend /visualizador/autorizar) decide se pode e so
# entao acrescenta a senha do Orthanc. Nenhuma senha passa por aqui.
#
# Host $http_host: o Orthanc monta os enderecos das imagens (BulkDataURI)
# a partir dele - assim eles apontam de volta para esta mesma origem.

# Endereco do radix-orthanc-cors consultado de novo a cada 10 s (DNS interno
# do Docker, 127.0.0.11): reiniciar esse servico nao deixa o visualizador sem
# imagens. O "resolver" fica dentro de cada bloco para nao colidir com o
# arquivo padrao do Nginx da imagem do OHIF.

location ^~ /dicom-web/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $radix_portaria radix-orthanc-cors;
    proxy_pass http://$radix_portaria:80;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location = /wado {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $radix_portaria radix-orthanc-cors;
    proxy_pass http://$radix_portaria:80;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
